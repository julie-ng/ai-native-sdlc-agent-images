version: "1.0.0"
title: "Plan a scoped issue"
description: "Inspect a prepared checkout and turn an issue into an implementation plan."
instructions: |
  {% filter indent(2) %}{% include "instructions.md" %}{% endfilter %}
prompt: |
  {% filter indent(2) %}{% include "prompt.md" %}{% endfilter %}
parameters:
  - key: issue_file
    input_type: string
    requirement: required
    description: "Absolute path to the issue text staged by the platform."
  - key: output_dir
    input_type: string
    requirement: required
    description: "Absolute path to a fresh writable artifact directory outside the checkout."
extensions:
  - type: builtin
    name: developer
settings:
  max_turns: 30
