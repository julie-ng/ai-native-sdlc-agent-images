version: "1.0.0"
title: "Implement a scoped plan"
description: "Implement one coding pass on a platform-selected branch and record evidence."
instructions: |
  {% filter indent(2) %}{% include "instructions.md" %}{% endfilter %}
prompt: |
  {% filter indent(2) %}{% include "prompt.md" %}{% endfilter %}
parameters:
  - key: plan_file
    input_type: string
    requirement: required
    description: "Absolute path to the plan staged by the platform."
  - key: branch
    input_type: string
    requirement: required
    description: "Unique agent/ task branch, already checked out with its remote configured."
  - key: output_dir
    input_type: string
    requirement: required
    description: "Absolute path to a fresh writable artifact directory outside the checkout."
  - key: feedback_file
    input_type: string
    requirement: optional
    default: ""
    description: "Absolute path to optional rework feedback staged by the platform."
extensions:
  - type: builtin
    name: developer
settings:
  max_turns: 80
